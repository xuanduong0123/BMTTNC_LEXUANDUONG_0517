<!DOCTYPE html>
<html lang="en">
<head>
    <title>RSA Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container mt-4">
        <table class="table table-bordered">
            <tr>
                <td colspan="2" style="text-align: center; font-weight: bold; font-size: 25px; background-color: #e9ecef;">
                    RSA CIPHER (ASYMMETRIC)
                </td>
            </tr>
            <tr>
                <td style="width: 50%; vertical-align: top;">
                    <span style="font-weight: bold; color: blue; font-size: 18px;">ENCRYPTION (Public Key)</span>
                    <hr>
                    <form method="POST" action="/rsa/encrypt">
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Plain text:</label>
                            <input type="text" class="form-control" name="inputPlainText" 
                                   value="{{ plain_text if plain_text else '' }}" placeholder="Input Plain Text" required autofocus />
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label font-weight-bold">Public Key e:</label>
                                <input type="number" class="form-control" name="inputE" value="{{ e if e else '' }}" placeholder="e" required />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label font-weight-bold">Modulus n:</label>
                                <input type="number" class="form-control" name="inputN" value="{{ n if n else '' }}" placeholder="n" required />
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Encrypt</button>
                    </form>
                    {% if encrypted_text %}
                    <div class="alert alert-primary mt-3">
                        <strong>Encrypted Text:</strong> <span class="text-danger font-weight-bold" style="word-break: break-all;">{{ encrypted_text }}</span>
                    </div>
                    {% endif %}
                </td>

                <td style="width: 50%; vertical-align: top;">
                    <span style="font-weight: bold; color: green; font-size: 18px;">DECRYPTION (Private Key)</span>
                    <hr>
                    <form method="POST" action="/rsa/decrypt">
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Cipher text:</label>
                            <input type="text" class="form-control" name="inputCipherText" 
                                   value="{{ cipher_text if cipher_text else '' }}" placeholder="Input Cipher Text" required />
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label font-weight-bold">Private Key d:</label>
                                <input type="number" class="form-control" name="inputD" value="{{ d if d else '' }}" placeholder="d" required />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label font-weight-bold">Modulus n:</label>
                                <input type="number" class="form-control" name="inputN" value="{{ n if n else '' }}" placeholder="n" required />
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success btn-block">Decrypt</button>
                    </form>
                    {% if decrypted_text %}
                    <div class="alert alert-success mt-3">
                        <strong>Decrypted Text:</strong> <span class="text-danger font-weight-bold">{{ decrypted_text }}</span>
                    </div>
                    {% endif %}
                </td>
            </tr>
        </table>
        <div class="text-center mt-3">
            <a href="/" class="btn btn-secondary btn-sm">Quay về trang chủ</a>
        </div>
    </div>
</body>
</html>
